<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}GFDS StrucObs{% endblock %}</title>
<style>
:root{
  --bg:#fff;--fg:#14181d;--mut:#667085;--line:#e4e7ec;--card:#f9fafb;--card2:#f2f4f7;
  --accent:#1554b8;--accent-fg:#fff;--ok:#067647;--bad:#b42318;--warn:#b54708;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216;--fg:#e8eaed;--mut:#98a2b3;--line:#262c33;--card:#161a1f;--card2:#1d2227;
  --accent:#4d8df0;--accent-fg:#06101f;--ok:#5fd09a;--bad:#ff8a80;--warn:#f5b26b;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;position:relative}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 12px;
  border-bottom:1px solid var(--line);margin-bottom:6px}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:16.5px;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .t small{color:var(--mut);font-size:12.5px}
.back{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);text-decoration:none;font-size:23px;line-height:1}
.gear{position:absolute;top:12px;right:0;display:grid;place-items:center;width:34px;height:34px;
  border-radius:9px;color:var(--mut);text-decoration:none}
.gear:hover{background:var(--card2);color:var(--fg)}
.gear svg{width:20px;height:20px}
button,.btn{font:inherit;border:0;border-radius:10px;background:var(--accent);
  color:var(--accent-fg);padding:13px 16px;font-weight:600;cursor:pointer;
  text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.sm,.btn.sm{padding:8px 11px;font-size:13px}
button:disabled{opacity:.45;cursor:default}
.wide{width:100%}
.sec{margin-top:22px}
.sec h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);
  font-weight:700;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
label.f:first-child{margin-top:0}
label.f small{font-weight:400;color:var(--mut)}
input[type=text],input[type=date],input[type=number],input[type=search],textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:86px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1}
.hint{font-size:12.5px;color:var(--mut);margin-top:6px}
.warnTxt{font-size:12.5px;color:var(--warn);margin-top:6px}
.list .it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:10px;cursor:pointer;color:var(--fg);font-weight:400}
.list .it:hover{border-color:var(--accent)}
.it .main{flex:1;min-width:0}
.it .nm{font-weight:650;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .meta{color:var(--mut);font-size:12.5px;margin-top:2px}
.it .go{color:var(--mut);font-size:20px;flex:0 0 auto}
.num{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.empty{text-align:center;color:var(--mut);padding:26px 16px;background:var(--card);
  border:1px dashed var(--line);border-radius:13px;font-size:14px}
.msg{font-size:13px;margin-top:12px;min-height:18px;text-align:center}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  padding:2px 8px;border-radius:999px;vertical-align:1px}
.pill.open{background:var(--warn);color:#fff}.pill.closed{background:var(--ok);color:#fff}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px 0 8px}
footer a{color:var(--mut)}
{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
<div class="msg" id="msg"></div>
<footer>GFDS Site Observation App - V1 - Oct 2026 · <a href="/logout">Sign out</a></footer>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts={}){
  if (opts.json !== undefined){
    opts = {...opts, body: JSON.stringify(opts.json),
            headers: {"Content-Type":"application/json", ...(opts.headers||{})}};
    delete opts.json;
  }
  const res = await fetch(path, opts);
  if (res.status === 401){ location.href = "/login"; throw new Error("unauthorized"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t, c="") => { $('msg').className = "msg " + c; $('msg').textContent = t; };
/* "2026-10-29" -> "10/29/26" */
const shortDate = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(iso || "");
  return m ? `${+m[2]}/${+m[3]}/${m[1].slice(2)}` : (iso || ""); };
const today = () => { const d = new Date(), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };
</script>
{% block script %}{% endblock %}
</body>
</html>
