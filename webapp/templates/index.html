<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GFDS StrucObs</title>
<style>
:root{
  --bg:#fff;--fg:#14181d;--mut:#667085;--line:#e4e7ec;--card:#f9fafb;--card2:#f2f4f7;
  --accent:#1554b8;--accent-fg:#fff;--ok:#067647;--bad:#b42318;--warn:#b54708;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216;--fg:#e8eaed;--mut:#98a2b3;--line:#262c33;--card:#161a1f;--card2:#1d2227;
  --accent:#4d8df0;--accent-fg:#06101f;--ok:#5fd09a;--bad:#ff8a80;--warn:#f5b26b;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;border:0;border-radius:9px;background:var(--accent);
  color:var(--accent-fg);padding:10px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.sm{padding:7px 10px;font-size:13px}
button:disabled{opacity:.35;cursor:default}
input[type=file]{display:none}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:76px;resize:vertical}

/* header: project, visit, Edit visit info, Finish */
header{display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.back{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);text-decoration:none;font-size:22px;line-height:1}
.hd{flex:1;min-width:0}
.projName{font-weight:700;font-size:16px;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12px}
header a.sm{text-decoration:none;display:inline-block}

/* ITEM 2.1 · 1/3  🗑 */
.counter{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.counter .lbl{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.counter .lbl small{font-weight:500;color:var(--mut);font-size:13px}
.trash{background:transparent;color:var(--bad);border:1px solid var(--line);
  padding:4px 8px;font-size:15px;border-radius:8px}

/* ◀ thumbnail ▶ */
.stage{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.arrow{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex:0 0 auto}
/* The photo takes what the phone has left: as wide as the space between the
   arrows, and as tall as the screen allows with Description and Action still
   in view below it (~490 px of everything else). dvh follows the phone's
   address bar; vh is the fallback for browsers without it. */
.thumb{position:relative;flex:0 0 auto;border-radius:14px;
  width:min(calc(100vw - 132px), 420px);
  height:clamp(180px, calc(100vh - 490px), 460px);
  height:clamp(180px, calc(100dvh - 490px), 460px);
  border:1px solid var(--line);background:var(--card2);overflow:hidden;padding:0;
  display:grid;place-items:center;color:var(--mut);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.thumb .add{display:grid;place-items:center;gap:4px;font-size:13px;font-weight:600}
.thumb .add svg{width:46px;height:46px}
.thumb .badge{position:absolute;right:7px;bottom:7px;background:rgba(0,0,0,.65);color:#fff;
  font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px}

/* 📍 📷 ☑ */
.tools{display:flex;justify-content:center;gap:12px;margin-top:12px}
.tool{display:grid;justify-items:center;gap:3px;width:84px;padding:8px 4px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:11.5px;font-weight:600}
.tool svg{width:24px;height:24px}
.tool.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.tool.off{color:var(--mut)}

.field{margin-top:14px}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);font-weight:700;margin-bottom:5px}
.field label small{text-transform:none;letter-spacing:0;font-weight:500}
.tx{display:flex;gap:8px;align-items:flex-start}
.mic{flex:0 0 auto;width:48px;height:48px;padding:0;border-radius:11px;display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--bad)}
.msg{font-size:12px;color:var(--mut);margin-top:5px;min-height:15px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}

dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);
  max-width:94vw;width:600px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlgHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.dlgHead b{font-size:14.5px}
.dlgBody{padding:14px;max-height:72vh;overflow:auto}
#planHolder{position:relative;touch-action:manipulation}
#planCanvas{width:100%;display:block;border:1px solid var(--line);border-radius:9px}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;pointer-events:none}

/* full-size photo: Keep · Retake · Delete */
#viewDlg{width:min(720px,96vw)}
.viewImg{position:relative;background:#000;display:grid;place-items:center;min-height:200px}
.viewImg img{max-width:100%;max-height:68vh;display:block}
.viewImg .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;
  border-radius:50%;padding:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px}
.viewImg .prev{left:8px}.viewImg .next{right:8px}
.viewBar{display:flex;gap:8px;padding:12px 14px}
.viewBar button{flex:1}
.viewBar .del{background:transparent;color:var(--bad);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="/" id="backLink" title="Project">&lsaquo;</a>
  <div class="hd">
    <div class="projName" id="projName">&nbsp;</div>
    <div class="sub" id="visitSub">Loading…</div>
  </div>
  <a class="ghost sm" id="btnEdit" href="#" style="border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;
     background:var(--card2);color:var(--fg);border:1px solid var(--line)">Edit</a>
  <button class="sm" id="btnFinish">Finish</button>
</header>

<div class="counter">
  <div class="lbl" id="itemLabel">—</div>
  <button class="trash" id="btnDelItem" title="Delete this item">&#128465;</button>
</div>

<div class="stage">
  <button class="arrow ghost" id="prev" aria-label="Previous item">&#9664;</button>
  <button class="thumb" id="thumb" aria-label="Photo"></button>
  <button class="arrow" id="next" aria-label="Next item">&#9654;</button>
</div>

<div class="tools">
  <button class="tool" id="toolLoc" title="Pick location on plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <span id="locLbl">Location</span></button>
  <button class="tool" id="toolCam" title="Take another photo of this item">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span>Add photo</span></button>
  <button class="tool" id="toolInc" title="Include in report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path id="incTick" d="M8 12.5l3 3 5-6"/></svg>
    <span id="incLbl">In report</span></button>
</div>

<div class="field">
  <label for="desc">Item description</label>
  <div class="tx"><textarea id="desc" placeholder="Type the description — or tap the mic."></textarea>
    <button class="mic" id="micDesc" aria-label="Dictate the description"></button></div>
  <div class="msg" id="descMsg"></div>
</div>

<div class="field">
  <label for="action">Action <small>(optional — makes this an action item)</small></label>
  <div class="tx"><textarea id="action" placeholder="Type the action — or tap the mic."></textarea>
    <button class="mic" id="micAct" aria-label="Dictate the action"></button></div>
  <div class="msg" id="actMsg"></div>
  <div id="axBox"></div>
</div>

<div class="msg" id="status" style="text-align:center"></div>
</div>

<input type="file" accept="image/*" capture="environment" id="camInput">

<dialog id="viewDlg">
  <div class="viewImg">
    <img id="viewImg" alt="">
    <button class="nav prev" id="viewPrev" aria-label="Previous photo">&#9664;</button>
    <button class="nav next" id="viewNext" aria-label="Next photo">&#9654;</button>
  </div>
  <div class="viewBar">
    <button id="viewKeep">Keep</button>
    <button class="ghost" id="viewRetake">Retake</button>
    <button class="del" id="viewDelete">Delete</button>
  </div>
</dialog>

<dialog id="planDlg">
  <div class="dlgHead"><b>Tap the location</b>
    <div style="display:flex;gap:7px">
      <button class="ghost sm" id="planClear">Clear</button>
      <button class="sm" id="planDone">Done</button></div></div>
  <div class="dlgBody">
    <select id="planSelect" style="margin-bottom:10px"></select>
    <div id="planHolder">
      <canvas id="planCanvas"></canvas>
      <div class="pin" id="planPin" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26">
          <path d="M12 0C7 0 3 4 3 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z" fill="#e5484d"/>
          <circle cx="12" cy="9" r="3.4" fill="#fff"/></svg>
      </div>
    </div>
    <div class="msg" id="planMsg"></div>
  </div>
</dialog>

{% include "_actions.html" %}

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAMERA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const MIC = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>`;
const STOP = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;

/* The screen walks the visit's entries: each is one ITEM with its own photos,
   description and action. (An item group holds one entry; older visits may
   hold several, and each still shows as its own ITEM.) */
let items = [], plans = [], visit = null, job = null, ei = 0;
let pendingLoc = null, retakeId = null, viewAt = 0;

const entries = () => items.flatMap(it => it.photos.map(e => ({it, e})));
const cur = () => entries()[ei] || null;
const label = e => `${visit ? visit.visit_no : "?"}.${e.number}`;

async function api(path, opts={}){
  const res = await fetch(path, opts);
  if (res.status === 401){ location.href = "/login"; throw new Error("unauthorized"); }
  if (res.status === 409){ location.href = "/"; throw new Error("no project open"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t,c="") => { $('status').className = "msg "+c; $('status').textContent = t; };

/* ---------------- render ---------------- */
function render(){
  const all = entries(), c = cur();
  const inReport = all.filter(x => x.e.include).length;
  $('visitSub').textContent = (visit ? `Site Visit ${visit.visit_no} · ` : "") +
    `${all.length} item${all.length===1?"":"s"} · ${inReport} in report`;
  $('prev').disabled = ei <= 0;
  const on = !!c;
  ['btnDelItem','toolLoc','toolCam','toolInc','desc','action','micDesc','micAct']
    .forEach(id => $(id).disabled = !on);
  if (!c){
    $('itemLabel').innerHTML = `No items yet`;
    $('thumb').innerHTML = `<span class="add">${CAMERA}Add photo</span>`;
    $('desc').value = ""; $('action').value = ""; $('axBox').innerHTML = "";
    return;
  }
  const {e} = c;
  $('itemLabel').innerHTML = `ITEM ${label(e)} <small>· ${ei+1}/${all.length}</small>`;

  const imgs = e.images || [];
  $('thumb').innerHTML = imgs.length
    ? `<img src="${imgs[0].thumb_url || imgs[0].url}" alt="ITEM ${label(e)}">
       ${imgs.length > 1 ? `<span class="badge">1/${imgs.length}</span>` : ""}`
    : `<span class="add">${CAMERA}Add photo</span>`;

  const plan = e.location && plans.find(p => p.plan_id === e.location.plan_id);
  $('toolLoc').classList.toggle('on', !!e.location);
  $('locLbl').textContent = e.location ? (plan ? shortName(plan.name) : "Located") : "Location";
  $('toolInc').classList.toggle('on', e.include);
  $('toolInc').classList.toggle('off', !e.include);
  $('incTick').style.display = e.include ? "" : "none";
  $('incLbl').textContent = e.include ? "In report" : "Excluded";

  /* never overwrite a box mid-dictation or mid-typing */
  if (dictating !== "desc" && document.activeElement !== $('desc')) $('desc').value = e.description || "";
  if (dictating !== "action" && document.activeElement !== $('action')) $('action').value = e.action || "";
  renderActions();
}
const shortName = n => String(n || "").replace(/\.(pdf|png|jpe?g)$/i, "").slice(0, 12);

/* updates and close-out, once the entry has a saved Action */
function renderActions(){
  const c = cur();
  if (!c || !(c.e.action || "").trim() || !visit){ $('axBox').innerHTML = ""; return; }
  const latest = job && job.last_visit ? job.last_visit.visit_no : visit.visit_no;
  ActionUI.render($('axBox'), {
    pid: visit.project_id, visit_no: visit.visit_no, photo_id: c.e.photo_id, label: label(c.e),
    updates: c.e.updates, closed_visit_no: c.e.closed_visit_no,
    default_visit_no: Math.max(latest, visit.visit_no + 1),
  }, fresh => { Object.assign(c.e, fresh); renderActions(); });
}

/* ---------------- data ---------------- */
async function load(){
  const r = await api('/api/visits/current');
  visit = r.visit; job = r.job;
  $('projName').textContent = job ? job.name : "GFDS StrucObs";
  document.title = `${job ? job.name : "GFDS StrucObs"} SV${visit.visit_no} — GFDS StrucObs`;
  if (job) $('backLink').href = `/projects/${job.job_id}`;
  $('btnEdit').href = `/visits/${visit.project_id}/edit`;
  const d = await api('/api/visit');
  items = d.items; plans = d.plans;
  ei = Math.min(ei, Math.max(0, entries().length - 1));
  render();
}

/* save fields on an entry: the current one, or the one being typed in when
   the save fires after the user has moved on */
async function patch(fields, c = cur()){
  if (!c) return;
  Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(fields)}));
  render();
}

const blank = e => !(e.images || []).length && !(e.description || "").trim() && !(e.action || "").trim();

async function newItem(){
  const it = await api('/api/item', {method:"POST"});
  items.push(it); ei = entries().length - 1;
  render(); say(`New ITEM ${label(it.photos[0])}`,"ok");
}

/* ---------------- navigation ---------------- */
$('prev').onclick = () => { if (ei > 0){ stopDictation(); ei--; render(); } };
/* ▶ goes to the next item; on the last one it starts a new item */
$('next').onclick = async () => {
  stopDictation();
  const all = entries();
  if (ei < all.length - 1){ ei++; return render(); }
  if (all.length && blank(all[ei].e)) return say("This item is still empty — add a photo or a description first.","warn");
  try{ await newItem(); }catch(err){ say(err.message,"bad"); }
};

$('btnDelItem').onclick = async () => {
  const c = cur(); if (!c) return;
  const n = (c.e.images || []).length;
  if (!confirm(`Delete ITEM ${label(c.e)}?\n\n${n ? `Its ${n} photo${n===1?"":"s"} and ` : "Its "}details will be permanently removed. This cannot be undone.`)) return;
  try{
    // the item group goes when this is its only entry; otherwise just the entry
    if (c.it.photos.length > 1) await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}`, {method:"DELETE"});
    else await api(`/api/item/${c.it.item_id}`, {method:"DELETE"});
    await load(); say(`ITEM ${label(c.e)} deleted.`,"ok");
  }catch(err){ say(err.message,"bad"); }
};

/* ---------------- photos ---------------- */
/* one photo per tap, straight from the phone's own camera app */
function takePhoto(retake=null){ retakeId = retake; $('camInput').click(); }

$('thumb').onclick = async () => {
  const c = cur();
  if (!c){ await newItem(); return takePhoto(); }
  if (!(c.e.images || []).length) return takePhoto();
  openViewer(0);
};
$('toolCam').onclick = () => takePhoto();

$('camInput').onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = "";
  const c = cur(); if (!f || !c) return;
  const fd = new FormData(); fd.append("photo", f);
  say(retakeId ? "Replacing photo…" : "Uploading photo…","warn");
  try{
    const path = retakeId
      ? `/api/item/${c.it.item_id}/photo/${c.e.photo_id}/image/${retakeId}`
      : `/api/item/${c.it.item_id}/photo`;
    if (!retakeId) fd.append("photo_id", c.e.photo_id);
    Object.assign(c.e, await api(path, {method:"POST", body:fd}));
    const n = c.e.images.length;
    say(retakeId ? "Photo replaced." : `Photo ${n} of ITEM ${label(c.e)} saved.`,"ok");
    render();
    if (retakeId && $('viewDlg').open) showView();
  }catch(err){ say(err.message,"bad"); }
  finally{ retakeId = null; }
};

function openViewer(at){ viewAt = at; showView(); $('viewDlg').showModal(); }
function showView(){
  const imgs = cur().e.images;
  viewAt = Math.min(viewAt, imgs.length - 1);
  $('viewImg').src = imgs[viewAt].url;
  $('viewPrev').hidden = viewAt <= 0;
  $('viewNext').hidden = viewAt >= imgs.length - 1;
}
$('viewPrev').onclick = () => { viewAt--; showView(); };
$('viewNext').onclick = () => { viewAt++; showView(); };
$('viewKeep').onclick = () => $('viewDlg').close();
$('viewRetake').onclick = () => takePhoto(cur().e.images[viewAt].image_id);
$('viewDelete').onclick = async () => {
  const c = cur(), im = c.e.images[viewAt];
  if (!confirm("Delete this photo? This cannot be undone.")) return;
  try{
    Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}/image/${im.image_id}`,
                                 {method:"DELETE"}));
    if (!c.e.images.length) $('viewDlg').close(); else showView();
    render(); say("Photo deleted.","ok");
  }catch(err){ say(err.message,"bad"); }
};

/* ---------------- include, typing ---------------- */
$('toolInc').onclick = () => { const c = cur(); if (c) patch({include: !c.e.include}); };
let dT; $('desc').oninput = () => { clearTimeout(dT); const c = cur(), v = $('desc').value;
  dT = setTimeout(()=>patch({description:v}, c), 700); };
let aT; $('action').oninput = () => { clearTimeout(aT); const c = cur(), v = $('action').value;
  aT = setTimeout(()=>patch({action:v}, c), 700); };

/* ---------------- dictation ---------------- */

/* Fold a SpeechRecognition results list into {fin, interim}, tolerating both
   fragment-per-entry and cumulative-per-entry browsers.

   Comparison is done on a normalised copy (lowercased, punctuation stripped)
   because Android capitalises and punctuates finalised entries, so an exact
   startsWith would miss the overlap and let the duplicates back in. */
function speechKey(t){
  return t.toLowerCase().replace(/[.,!?;:’']/g, "").replace(/\s+/g, " ").trim();
}

function assembleSpeech(results){
  const finals = [];
  let interim = "";
  for (let i = 0; i < results.length; i++){
    const t = (results[i][0] && results[i][0].transcript || "").trim();
    if (!t) continue;
    if (results[i].isFinal) finals.push(t);
    else interim = t;            // the newest interim IS the whole current guess
  }

  let fin = "";
  for (const t of finals){
    if (!fin){ fin = t; continue; }
    const a = speechKey(fin), b = speechKey(t);
    /* cumulative only when the entry is STRICTLY longer and extends what we
       have; equal-length means the speaker genuinely repeated themselves */
    if (b.length > a.length && b.startsWith(a)) fin = t;
    else fin += " " + t;
  }

  /* an interim that merely restates the final adds nothing - but never let an
     interim become the final when there is no final yet */
  if (fin && interim){
    const a = speechKey(fin), b = speechKey(interim);
    if (b.length > a.length && b.startsWith(a)){ fin = interim; interim = ""; }
    else if (a.endsWith(b)) interim = "";
  }
  return { fin, interim };
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* one dictation at a time: which box it fills, and its button and message */
let sr=null, dictating=null, baseText="", finalText="", wantMore=false;
const DICTATE = {
  desc:   {box:'desc',   btn:'micDesc', msg:'descMsg', field:'description'},
  action: {box:'action', btn:'micAct',  msg:'actMsg',  field:'action'},
};
$('micDesc').innerHTML = MIC; $('micAct').innerHTML = MIC;
if (!SR) [$('micDesc'), $('micAct')].forEach(b => b.title = "This browser has no speech recognition");

function stopDictation(){ if (dictating){ wantMore = false; sr.stop(); } }

function dictate(which){
  const d = DICTATE[which], note = (t,c) => { $(d.msg).className = "msg "+c; $(d.msg).textContent = t; };
  if (!cur()) return say("Add an item first","bad");
  if (!SR) return note("No browser dictation — use the mic key on your keyboard.","bad");
  if (dictating){ stopDictation(); return; }   // either mic stops it
  sr = new SR(); sr.lang = "en-US"; sr.interimResults = true;
  /* Chrome on Android duplicates finalised results when continuous is on, so
     run single-utterance there and restart on end while the user is still
     dictating. Desktop keeps continuous for a smoother stream. */
  sr.continuous = !/Android/i.test(navigator.userAgent);
  wantMore = true;
  /* keep what is already typed exactly, line breaks and all; only add a
     separator when it does not already end in whitespace */
  baseText = $(d.box).value;
  if (baseText && !/\s$/.test(baseText)) baseText += " ";
  finalText = "";
  const target = cur();          // the entry the words belong to, even if the user moves on
  sr.onstart = () => { dictating = which; $(d.btn).innerHTML = STOP; $(d.btn).classList.add('live');
    note("Listening — speak now. Tap ■ to stop.","warn"); };
  /* Rebuild from the whole results list every time: several mobile browsers
     report resultIndex as 0 on every event, and some repeat the whole
     transcript in every entry. assembleSpeech() copes with both. */
  sr.onresult = ev => {
    const { fin, interim } = assembleSpeech(ev.results);
    finalText = fin;
    const spoken = (fin + (fin && interim ? " " : "") + interim);
    if (cur()?.e === target.e)
      $(d.box).value = baseText + spoken.replace(/\s+/g, " ").trimStart();
  };
  sr.onerror = ev => {
    if (ev.error === "no-speech" && wantMore) return;   // restarting; stay quiet
    wantMore = false;
    note(ev.error==="not-allowed" ? "Microphone permission denied."
      : ev.error==="no-speech" ? "Didn't catch anything — try again."
      : ev.error==="network" ? "Dictation needs a network connection."
      : "Dictation error: "+ev.error, "bad"); };
  sr.onend = async () => {
    if (wantMore) {                      // single-utterance mode: keep listening
      const committed = (baseText + finalText).replace(/\s+/g, " ").trimStart();
      baseText = committed ? committed + " " : "";
      finalText = "";
      try { sr.start(); return; } catch (e) { /* fall through and stop */ }
    }
    dictating = null; $(d.btn).innerHTML = MIC; $(d.btn).classList.remove('live');
    /* keep only finalised speech; drop any trailing interim guess */
    const text = (baseText + finalText.replace(/\s+/g, " ").trimStart()).trimEnd();
    try{
      Object.assign(target.e, await api(`/api/item/${target.it.item_id}/photo/${target.e.photo_id}`, {
        method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({[d.field]: text})}));
    }catch(err){ return note(err.message, "bad"); }
    render();
    if (!$(d.msg).classList.contains("bad"))
      note(finalText.trim() ? "Dictation saved." : "Nothing captured.", "ok");
  };
  try { sr.start(); }
  catch(err){ note("Could not start: "+err.message, "bad"); }
}
$('micDesc').onclick = () => dictate("desc");
$('micAct').onclick = () => dictate("action");

/* ---------------- location on plan ---------------- */
$('toolLoc').onclick = openPlan;
async function openPlan(){
  if (!plans.length)
    return say("No plans yet — add them on the project page: Edit → Plans.","bad");
  $('planSelect').innerHTML = plans.map(p =>
    `<option value="${p.plan_id}">${esc(p.name)} (${p.pages} page${p.pages===1?"":"s"})</option>`).join("");
  const e = cur().e;
  pendingLoc = e.location ? {...e.location} : null;
  if (pendingLoc) $('planSelect').value = pendingLoc.plan_id;
  $('planPin').hidden = true;
  $('planDlg').showModal();
  await drawPlan();
}
$('planSelect').onchange = () => { pendingLoc=null; $('planPin').hidden=true; drawPlan(); };

async function drawPlan(){
  const p = plans.find(x => x.plan_id === $('planSelect').value);
  const cv = $('planCanvas'), ctx = cv.getContext('2d');
  $('planMsg').textContent = "Loading plan…";
  try{
    if ((p.name||"").toLowerCase().endsWith(".pdf")){
      const buf = await (await fetch(p.url)).arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const page = await pdf.getPage(pendingLoc?.page || 1);
      const vp = page.getViewport({scale:2});
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      $('planMsg').textContent = `Page 1 of ${pdf.numPages} — tap to place the marker.`;
    } else {
      const img = new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=p.url;});
      cv.width=img.width; cv.height=img.height; ctx.drawImage(img,0,0);
      $('planMsg').textContent = "Tap to place the marker.";
    }
    if (pendingLoc) showPin(pendingLoc.x, pendingLoc.y);
  }catch(err){ $('planMsg').textContent = "Could not render plan: "+err.message; }
}
function showPin(x,y){ const p=$('planPin');
  p.style.left=(x*100)+"%"; p.style.top=(y*100)+"%"; p.hidden=false; }

$('planCanvas').onclick = ev => {
  const r = $('planCanvas').getBoundingClientRect();
  /* normalised 0-1: survives any screen size, zoom or re-render */
  const x = (ev.clientX-r.left)/r.width, y = (ev.clientY-r.top)/r.height;
  pendingLoc = {plan_id:$('planSelect').value, page: pendingLoc?.page || 1, x, y};
  showPin(x,y);
  $('planMsg').textContent = `x ${x.toFixed(3)} · y ${y.toFixed(3)}`;
};
$('planClear').onclick = () => { pendingLoc=null; $('planPin').hidden=true;
  $('planMsg').textContent="Marker cleared."; };
$('planDone').onclick = async () => { $('planDlg').close(); await patch({location:pendingLoc}); };

/* back to the project page; the report is generated from there */
$('btnFinish').onclick = async () => {
  stopDictation();
  try{ await api('/api/projects/close', {method:"POST"}); }catch(err){ /* leaving anyway */ }
  location.href = job ? `/projects/${job.job_id}` : "/";
};

load().catch(e => say(e.message,"bad"));
</script>
