<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GFDS Observation App</title>
<style>
:root{
  --bg:#fff;--fg:#14181d;--mut:#667085;--line:#e4e7ec;--card:#f9fafb;--card2:#f2f4f7;
  --accent:#2b3036;--accent-fg:#fff;--ok:#067647;--bad:#b42318;--warn:#b54708;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216;--fg:#e8eaed;--mut:#98a2b3;--line:#262c33;--card:#161a1f;--card2:#1d2227;
  --accent:#e8eaed;--accent-fg:#14181d;--ok:#5fd09a;--bad:#ff8a80;--warn:#f5b26b;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;border:0;border-radius:9px;background:var(--accent);
  color:var(--accent-fg);padding:10px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.sm{padding:7px 10px;font-size:13px}
button:disabled{opacity:.35;cursor:default}
input[type=file]{display:none}
textarea,select{width:100%;padding:10px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:76px;resize:vertical}

/* header: project, visit, Edit visit info, Finish */
header{display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.back{flex:0 0 auto;display:grid;place-items:center;width:34px;height:34px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);text-decoration:none;font-size:22px;line-height:1}
.hd{flex:1;min-width:0}
.projName{font-weight:700;font-size:16px;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12px}
header a.sm{text-decoration:none;display:inline-block}

/* ITEM 2.1 · 1/3  🗑 */
.counter{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px}
.counter .lbl{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.counter .lbl small{font-weight:500;color:var(--mut);font-size:13px}
.trash{background:transparent;color:var(--bad);border:1px solid var(--line);
  padding:4px 8px;font-size:15px;border-radius:8px}

/* ◀ thumbnail ▶ */
.stage{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.arrow{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex:0 0 auto}
/* The photo takes what the phone has left: as wide as the space between the
   arrows, and as tall as the screen allows with Description and Action still
   in view below it (~490 px of everything else). dvh follows the phone's
   address bar; vh is the fallback for browsers without it. */
.thumb{position:relative;flex:0 0 auto;border-radius:14px;
  width:min(calc(100vw - 132px), 420px);
  height:clamp(180px, calc(100vh - 490px), 460px);
  height:clamp(180px, calc(100dvh - 490px), 460px);
  border:1px solid var(--line);background:var(--card2);overflow:hidden;padding:0;
  display:grid;place-items:center;color:var(--mut);cursor:pointer}

/* 📍 ☑ (photos are added from the photo box) */
.tools{display:flex;justify-content:center;gap:12px;margin-top:12px}
.tool{display:grid;justify-items:center;gap:3px;width:84px;padding:8px 4px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:11.5px;font-weight:600}
.tool svg{width:24px;height:24px}
.tool.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.tool.off{color:var(--mut)}

.field{margin-top:14px}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mut);font-weight:700;margin-bottom:5px}
.field label small{text-transform:none;letter-spacing:0;font-weight:500}
.tx{display:flex;gap:8px;align-items:flex-start}
.mic{flex:0 0 auto;width:48px;height:48px;padding:0;border-radius:11px;display:grid;place-items:center}
.mic svg{width:22px;height:22px}
.mic.live{background:var(--bad)}
.msg{font-size:12px;color:var(--mut);margin-top:5px;min-height:15px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}

dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);
  max-width:94vw;width:600px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlgHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.dlgHead b{font-size:14.5px}
.dlgBody{padding:14px;max-height:72vh;overflow:auto}
/* location picker: the sheet sits on a stage that pans and zooms inside the
   holder; pins counter-scale (--inv) so they stay one size while zooming */
#planDlg{width:min(760px,96vw)}
#planHolder{position:relative;overflow:hidden;touch-action:none;height:min(62vh,600px);
  background:var(--card2);border:1px solid var(--line);border-radius:9px;cursor:crosshair}
#planStage{position:absolute;left:0;top:0;transform-origin:0 0;--inv:1}
#planCanvas{display:block;width:100%;height:100%;background:#fff}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;pointer-events:none;
  transform:scale(var(--inv));transform-origin:50% 100%}
.opin{position:absolute;pointer-events:none;transform:translate(-50%,-50%) scale(var(--inv));
  min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:rgba(102,112,133,.55);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.zoomBtns{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.zoomBtns button{width:38px;height:38px;padding:0;border-radius:9px;font-size:18px;
  background:rgba(255,255,255,.92);color:#14181d;border:1px solid var(--line)}

</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="/" id="backLink" title="Project">&lsaquo;</a>
  <div class="hd">
    <div class="projName" id="projName">&nbsp;</div>
    <div class="sub" id="visitSub">Loading…</div>
  </div>
  <a class="ghost sm" id="btnEdit" href="#" style="border-radius:9px;padding:7px 10px;font-size:13px;font-weight:600;
     background:var(--card2);color:var(--fg);border:1px solid var(--line)">Edit</a>
  <button class="sm" id="btnFinish">Finish</button>
</header>

<div class="counter">
  <div class="lbl" id="itemLabel">—</div>
  <button class="trash" id="btnDelItem" title="Delete this item">&#128465;</button>
</div>

<div class="stage">
  <button class="arrow ghost" id="prev" aria-label="Previous item">&#9664;</button>
  <button class="thumb" id="thumb" aria-label="Photo"></button>
  <button class="arrow" id="next" aria-label="Next item">&#9654;</button>
</div>

<div class="tools">
  <button class="tool" id="toolLoc" title="Pick location on plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.6 7-12a7 7 0 0 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>
    <span id="locLbl">Location</span></button>
  <button class="tool" id="toolInc" title="Include in report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path id="incTick" d="M8 12.5l3 3 5-6"/></svg>
    <span id="incLbl">In report</span></button>
</div>

<div class="field">
  <label for="desc">Item description</label>
  <div class="tx"><textarea id="desc" placeholder="Type the description — or tap the mic."></textarea>
    <button class="mic" id="micDesc" aria-label="Dictate the description"></button></div>
  <div class="msg" id="descMsg"></div>
</div>

<div class="field">
  <label for="action">Action <small>(optional — makes this an action item)</small></label>
  <div class="tx"><textarea id="action" placeholder="Type the action — or tap the mic."></textarea>
    <button class="mic" id="micAct" aria-label="Dictate the action"></button></div>
  <div class="msg" id="actMsg"></div>
  <div id="axBox"></div>
</div>

<div class="msg" id="status" style="text-align:center"></div>
</div>

<dialog id="planDlg">
  <div class="dlgHead"><b id="planTitle">Tap the location</b>
    <div style="display:flex;gap:7px">
      <button class="ghost sm" id="planSkip">Skip</button>
      <button class="ghost sm" id="planClear">Clear</button>
      <button class="sm" id="planDone">Done</button></div></div>
  <div class="dlgBody">
    <select id="planSelect" style="margin-bottom:10px"></select>
    <div id="planHolder">
      <div id="planStage">
        <canvas id="planCanvas"></canvas>
        <div id="planPins"></div>
        <div class="pin" id="planPin" hidden>
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path d="M12 0C7 0 3 4 3 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z" fill="#e5484d"/>
            <circle cx="12" cy="9" r="3.4" fill="#fff"/></svg>
        </div>
      </div>
      <div class="zoomBtns">
        <button id="zoomOut" aria-label="Zoom out">&minus;</button>
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomFit" aria-label="Show the whole sheet" style="font-size:14px">&#9635;</button>
      </div>
    </div>
    <div class="msg" id="planMsg"></div>
  </div>
</dialog>

{% include "_dictate.html" %}
{% include "_photos.html" %}
{% include "_tips.html" %}
{% include "_actions.html" %}

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* The screen walks the visit's entries: each is one ITEM with its own photos,
   description and action. (An item group holds one entry; older visits may
   hold several, and each still shows as its own ITEM.) */
let items = [], plans = [], visit = null, job = null, ei = 0;
let pendingLoc = null;

const entries = () => items.flatMap(it => it.photos.map(e => ({it, e})));
const cur = () => entries()[ei] || null;
const label = e => `${visit ? visit.visit_no : "?"}.${e.number}`;

async function api(path, opts={}){
  const res = await fetch(path, opts);
  if (res.status === 401){ location.href = "/login"; throw new Error("unauthorized"); }
  if (res.status === 409){ location.href = "/"; throw new Error("no project open"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t,c="") => { $('status').className = "msg "+c; $('status').textContent = t; };

/* ---------------- render ---------------- */
function render(){
  const all = entries(), c = cur();
  const inReport = all.filter(x => x.e.include).length;
  $('visitSub').textContent = (visit ? `Site Visit ${visit.visit_no} · ` : "") +
    `${all.length} item${all.length===1?"":"s"} · ${inReport} in report`;
  $('prev').disabled = ei <= 0;
  const on = !!c;
  ['btnDelItem','toolLoc','toolInc','desc','action','micDesc','micAct']
    .forEach(id => $(id).disabled = !on);
  if (!c){
    $('itemLabel').innerHTML = `No items yet`;
    renderPhotoBox();
    $('desc').value = ""; $('action').value = ""; $('axBox').innerHTML = "";
    return;
  }
  const {e} = c;
  $('itemLabel').innerHTML = `ITEM ${label(e)} <small>· ${ei+1}/${all.length}</small>`;

  renderPhotoBox();

  const plan = e.location && plans.find(p => p.plan_id === e.location.plan_id);
  $('toolLoc').classList.toggle('on', !!e.location);
  $('locLbl').textContent = e.location ? (plan ? shortName(plan.name) : "Located") : "Location";
  $('toolInc').classList.toggle('on', e.include);
  $('toolInc').classList.toggle('off', !e.include);
  $('incTick').style.display = e.include ? "" : "none";
  $('incLbl').textContent = e.include ? "In report" : "Excluded";

  /* never overwrite a box mid-dictation or mid-typing */
  if (Dictate.box !== $('desc') && document.activeElement !== $('desc')) $('desc').value = e.description || "";
  if (Dictate.box !== $('action') && document.activeElement !== $('action')) $('action').value = e.action || "";
  renderActions();
}
const shortName = n => String(n || "").replace(/\.(pdf|png|jpe?g)$/i, "").slice(0, 12);

/* updates and close-out, once the entry has a saved Action */
function renderActions(){
  const c = cur();
  if (!c || !(c.e.action || "").trim() || !visit){ $('axBox').innerHTML = ""; return; }
  const latest = job && job.last_visit ? job.last_visit.visit_no : visit.visit_no;
  ActionUI.render($('axBox'), {
    pid: visit.project_id, visit_no: visit.visit_no, photo_id: c.e.photo_id, label: label(c.e),
    description: c.e.description, action: c.e.action,
    updates: c.e.updates, closed_visit_no: c.e.closed_visit_no,
    default_visit_no: Math.max(latest, visit.visit_no + 1),
  }, fresh => { Object.assign(c.e, fresh); renderActions(); });
}

/* ---------------- data ---------------- */
async function load(){
  const r = await api('/api/visits/current');
  visit = r.visit; job = r.job;
  $('projName').textContent = job ? job.name : "GFDS Observation App";
  document.title = `${job ? job.name : "GFDS Observation App"} SV${visit.visit_no} — GFDS Observation App`;
  if (job) $('backLink').href = `/projects/${job.job_id}`;
  $('btnEdit').href = `/visits/${visit.project_id}/edit`;
  const d = await api('/api/visit');
  items = d.items; plans = d.plans;
  ei = Math.min(ei, Math.max(0, entries().length - 1));
  render();
}

/* save fields on an entry: the current one, or the one being typed in when
   the save fires after the user has moved on */
async function patch(fields, c = cur()){
  if (!c) return;
  Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(fields)}));
  render();
}

const blank = e => !(e.images || []).length && !(e.description || "").trim() && !(e.action || "").trim();

async function newItem(){
  const it = await api('/api/item', {method:"POST"});
  items.push(it); ei = entries().length - 1;
  render(); say(`New ITEM ${label(it.photos[0])}`,"ok");
}

/* ---------------- navigation ---------------- */
$('prev').onclick = () => { if (ei > 0){ Dictate.stop(); ei--; render(); } };
/* ▶ goes to the next item; on the last one it starts a new item */
$('next').onclick = async () => {
  Dictate.stop();
  const all = entries();
  if (ei < all.length - 1){ ei++; return render(); }
  if (all.length && blank(all[ei].e)) return say("This item is still empty — add a photo or a description first.","warn");
  try{ await newItem(); }catch(err){ say(err.message,"bad"); }
};

$('btnDelItem').onclick = async () => {
  const c = cur(); if (!c) return;
  const n = (c.e.images || []).length;
  if (!confirm(`Delete ITEM ${label(c.e)}?\n\n${n ? `Its ${n} photo${n===1?"":"s"} and ` : "Its "}details will be permanently removed. This cannot be undone.`)) return;
  try{
    // the item group goes when this is its only entry; otherwise just the entry
    if (c.it.photos.length > 1) await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}`, {method:"DELETE"});
    else await api(`/api/item/${c.it.item_id}`, {method:"DELETE"});
    await load(); say(`ITEM ${label(c.e)} deleted.`,"ok");
  }catch(err){ say(err.message,"bad"); }
};

/* ---------------- photos ---------------- */
/* The photo box: empty, a tap opens the camera (or the library link);
   with photos, a tap opens the photo screen to retake, delete or add more.
   Item photos upload as soon as they are taken. */
const shots = e => (e.images || []).map(im => ({url: im.url, thumb: im.thumb_url || im.url}));
function renderPhotoBox(){
  const c = cur();
  Photos.box($('thumb'), c ? shots(c.e) : [], {
    label: c ? "Add photo" : "Tap to take the first photo",
    onCamera: () => addFrom("camera"),
    onLibrary: () => addFrom("library"),
    onOpen: at => Photos.open(photoStore(cur()), at),
  });
}

/* the first photos of an item: uploaded, then on to its location */
function addFrom(source){
  // open the picker straight from the tap (phones refuse it after a wait);
  // a visit with no item yet gets one when the photo arrives
  Photos.pick(source, async files => {
    let c = cur();
    try{ if (!c){ await newItem(); c = cur(); } }catch(err){ return say(err.message,"bad"); }
    const askWhere = !(c.e.images || []).length && !c.e.location && plans.length > 0;
    try{
      await upload(c, files);
      if (askWhere && cur()?.e === c.e) openPlan({after: true});
    }catch(err){ say(err.message,"bad"); }
  });
}

/* one after another, so they keep the order they were picked in */
async function upload(c, files){
  for (const [i, f] of files.entries()){
    say(files.length > 1 ? `Uploading photo ${i + 1} of ${files.length}…` : "Uploading photo…","warn");
    const fd = new FormData(); fd.append("photo", f); fd.append("photo_id", c.e.photo_id);
    Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo`, {method:"POST", body:fd}));
  }
  render();
  say(`${files.length > 1 ? files.length + " photos" : "Photo"} saved to ITEM ${label(c.e)}.`,"ok");
}

/* the photo screen's view of an item: changes go to the server at once */
function photoStore(c){
  const im = i => c.e.images[i];
  return {
    title: (i, n) => `ITEM ${label(c.e)} · photo ${i + 1} of ${n}`,
    list: () => shots(c.e),
    add: files => upload(c, files),
    retake: async (i, f) => {
      const fd = new FormData(); fd.append("photo", f);
      Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}/image/${im(i).image_id}`,
                                   {method:"POST", body:fd}));
      render(); say("Photo replaced.","ok");
    },
    remove: async i => {
      Object.assign(c.e, await api(`/api/item/${c.it.item_id}/photo/${c.e.photo_id}/image/${im(i).image_id}`,
                                   {method:"DELETE"}));
      render(); say("Photo deleted.","ok");
    },
  };
}

/* ---------------- include, typing ---------------- */
$('toolInc').onclick = () => { const c = cur(); if (c) patch({include: !c.e.include}); };
let dT; $('desc').oninput = () => { clearTimeout(dT); const c = cur(), v = $('desc').value;
  dT = setTimeout(()=>patch({description:v}, c), 700); };
let aT; $('action').oninput = () => { clearTimeout(aT); const c = cur(), v = $('action').value;
  aT = setTimeout(()=>patch({action:v}, c), 700); };

/* ---------------- dictation ---------------- */
/* the words go to the item the mic was tapped on, even if the user moves on */
$('micDesc').innerHTML = Dictate.MIC; $('micAct').innerHTML = Dictate.MIC;
if (!Dictate.supported) [$('micDesc'), $('micAct')].forEach(b => b.title = "This browser has no speech recognition");
function dictate(box, btn, msg, field){
  const note = (t, cls) => { $(msg).className = "msg " + cls; $(msg).textContent = t; };
  const target = cur();
  if (!target) return say("Add an item first","bad");
  Dictate.toggle({box: $(box), btn: $(btn), note,
    belongs: () => cur()?.e === target.e,
    onDone: async text => {
      Object.assign(target.e, await api(`/api/item/${target.it.item_id}/photo/${target.e.photo_id}`, {
        method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify({[field]: text})}));
      render();
    }});
}
$('micDesc').onclick = () => dictate('desc', 'micDesc', 'descMsg', 'description');
$('micAct').onclick = () => dictate('action', 'micAct', 'actMsg', 'action');

/* ---------------- location on plan ---------------- */
/* The last sheet a pin went on, per visit, so the next item opens there. */
const sheetKey = () => `strucobs:lastSheet:${visit ? visit.project_id : ""}`;
const lastSheet = () => { try{ return localStorage.getItem(sheetKey()) || ""; }catch(e){ return ""; } };
const rememberSheet = v => { try{ localStorage.setItem(sheetKey(), v); }catch(e){ /* private mode */ } };

$('toolLoc').onclick = () => openPlan();
async function openPlan({after = false} = {}){
  if (!plans.length)
    return say("This project has no plans yet. Add them under Edit project info on the project page.","bad");
  /* one choice per sheet: "S1.0 — Martis Camp Structure" by its sheet number,
     else "Martis Camp Structure — sheet 7" (its number as uploaded) */
  const setName = p => String(p.name || "").replace(/\.(pdf|png|jpe?g)$/i, "").replace(/^\d{6}[\s_-]+/, "");
  $('planSelect').innerHTML = plans.flatMap(p => Array.from({length: p.pages || 1}, (_, i) => {
    const no = ((p.sheet_nos || [])[i] || "").trim();
    const label = (p.page_labels || [])[i] || i + 1;
    const nm = no ? `${esc(no)} — ${esc(setName(p))}`
      : (p.pages || 1) > 1 || p.page_labels ? `${esc(setName(p))} — sheet ${label}` : esc(setName(p));
    return `<option value="${p.plan_id}|${i + 1}">${nm}</option>`;
  })).join("");
  const e = cur().e;
  pendingLoc = e.location ? {...e.location} : null;
  // this item's own sheet, else the last sheet used in this visit, else the first
  $('planSelect').value = pendingLoc ? `${pendingLoc.plan_id}|${pendingLoc.page || 1}` : lastSheet();
  if (!$('planSelect').value) $('planSelect').selectedIndex = 0;
  $('planTitle').textContent = after ? `Where is ITEM ${label(e)}?` : "Tap the location";
  $('planSkip').hidden = !after;
  $('planPin').hidden = true;
  $('planDlg').showModal();
  await drawPlan();
}
$('planSelect').onchange = () => { pendingLoc=null; $('planPin').hidden=true; drawPlan(); };

const picked = () => { const [plan_id, page] = $('planSelect').value.split("|");
  return {plan_id, page: +page || 1}; };

/* ---- pan and zoom: the stage is the sheet at "fit" size, moved by view ---- */
let view = {s: 1, x: 0, y: 0}, fitW = 0, fitH = 0;
const MAX_ZOOM = 8;

function applyView(){
  const hold = $('planHolder'), W = hold.clientWidth, H = hold.clientHeight;
  view.s = Math.min(MAX_ZOOM, Math.max(1, view.s));
  const w = fitW * view.s, h = fitH * view.s;
  // keep the sheet on screen: centred while smaller than the holder, else edge to edge
  view.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, view.x));
  view.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, view.y));
  const st = $('planStage');
  st.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  st.style.setProperty('--inv', 1 / view.s);
}
function fitSheet(){
  const hold = $('planHolder'), cv = $('planCanvas');
  const W = hold.clientWidth, H = hold.clientHeight;
  const k = Math.min(W / cv.width, H / cv.height);
  fitW = cv.width * k; fitH = cv.height * k;
  const st = $('planStage');
  st.style.width = fitW + "px"; st.style.height = fitH + "px";
  view = {s: 1, x: 0, y: 0};
  applyView();
}
/* zoom by f around a point in the holder (default: its centre) */
function zoomAt(f, px, py){
  const hold = $('planHolder');
  if (px === undefined){ px = hold.clientWidth / 2; py = hold.clientHeight / 2; }
  const s = Math.min(MAX_ZOOM, Math.max(1, view.s * f)), k = s / view.s;
  view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = s;
  applyView();
}
/* show a spot (0-1) at this zoom, centred */
function focusOn(x, y, s){
  const hold = $('planHolder');
  view.s = s;
  view.x = hold.clientWidth / 2 - x * fitW * s;
  view.y = hold.clientHeight / 2 - y * fitH * s;
  applyView();
}
$('zoomIn').onclick = () => zoomAt(1.6);
$('zoomOut').onclick = () => zoomAt(1 / 1.6);
$('zoomFit').onclick = () => { view = {s: 1, x: 0, y: 0}; applyView(); };

/* one finger drags, two pinch; a touch that hardly moves is a tap that places the pin */
const touches = new Map();
let gesture = null;
const holderPoint = ev => { const r = $('planHolder').getBoundingClientRect();
  return {x: ev.clientX - r.left, y: ev.clientY - r.top}; };
$('planHolder').addEventListener('pointerdown', ev => {
  if (ev.target.closest('.zoomBtns')) return;
  // keep getting moves when the finger slides off the sheet (best effort)
  try{ $('planHolder').setPointerCapture(ev.pointerId); }catch(e){ /* not capturable */ }
  touches.set(ev.pointerId, holderPoint(ev));
  gesture = touches.size === 1
    ? {tap: true, start: holderPoint(ev), view: {...view}}
    : {tap: false, pinch: pinchOf(), view: {...view}};
});
function pinchOf(){
  const [a, b] = [...touches.values()];
  return {d: Math.hypot(a.x - b.x, a.y - b.y) || 1, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2};
}
$('planHolder').addEventListener('pointermove', ev => {
  if (!touches.has(ev.pointerId) || !gesture) return;
  touches.set(ev.pointerId, holderPoint(ev));
  if (touches.size >= 2 && gesture.pinch){
    const now = pinchOf(), was = gesture.pinch, v = gesture.view;
    const s = Math.min(MAX_ZOOM, Math.max(1, v.s * now.d / was.d)), k = s / v.s;
    view = {s, x: now.mx - (was.mx - v.x) * k, y: now.my - (was.my - v.y) * k};
    applyView();
  } else if (touches.size === 1){
    const p = holderPoint(ev), dx = p.x - gesture.start.x, dy = p.y - gesture.start.y;
    if (Math.hypot(dx, dy) > 6) gesture.tap = false;
    if (!gesture.tap){ view.x = gesture.view.x + dx; view.y = gesture.view.y + dy; applyView(); }
  }
});
function endTouch(ev){
  if (!touches.has(ev.pointerId)) return;
  const was = gesture;
  touches.delete(ev.pointerId);
  if (was && was.tap && touches.size === 0 && ev.type === "pointerup") placePin(ev);
  // the finger left on the glass carries on as a drag from here
  gesture = touches.size === 1
    ? {tap: false, start: [...touches.values()][0], view: {...view}} : null;
}
$('planHolder').addEventListener('pointerup', endTouch);
$('planHolder').addEventListener('pointercancel', endTouch);
$('planHolder').addEventListener('wheel', ev => {
  ev.preventDefault();
  const p = holderPoint(ev);
  zoomAt(ev.deltaY < 0 ? 1.25 : 1 / 1.25, p.x, p.y);
}, {passive: false});

function placePin(ev){
  const r = $('planCanvas').getBoundingClientRect();   // includes the pan and zoom
  /* normalised 0-1: survives any screen size, zoom or re-render */
  const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
  if (x < 0 || x > 1 || y < 0 || y > 1) return;
  pendingLoc = {...picked(), x, y};
  showPin(x, y);
  $('planMsg').textContent = "Pin placed — tap Done, or tap again to move it.";
}

/* this visit's other pins on the sheet, faint, with their ITEM numbers */
function otherPins(){
  const {plan_id, page} = picked(), me = cur()?.e;
  $('planPins').innerHTML = entries()
    .filter(({e}) => e !== me && e.location && e.location.plan_id === plan_id
                     && (e.location.page || 1) === page)
    .map(({e}) => `<div class="opin" style="left:${e.location.x * 100}%;top:${e.location.y * 100}%">${label(e)}</div>`)
    .join("");
}

async function drawPlan(){
  const {plan_id, page: sheet} = picked();
  const p = plans.find(x => x.plan_id === plan_id);
  const cv = $('planCanvas'), ctx = cv.getContext('2d');
  $('planMsg').textContent = "Loading plan…";
  try{
    if ((p.name||"").toLowerCase().endsWith(".pdf")){
      const buf = await (await fetch(p.url)).arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const page = await pdf.getPage(Math.min(sheet, pdf.numPages));
      // sharp enough to zoom into: about 3000 px on the long side
      const base = page.getViewport({scale: 1});
      const vp = page.getViewport({scale: Math.min(4, 3000 / Math.max(base.width, base.height))});
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:ctx, viewport:vp}).promise;
    } else {
      const img = new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=p.url;});
      cv.width=img.width; cv.height=img.height; ctx.drawImage(img,0,0);
    }
    fitSheet();
    otherPins();
    if (pendingLoc){ showPin(pendingLoc.x, pendingLoc.y); focusOn(pendingLoc.x, pendingLoc.y, 2.5); }
    $('planMsg').textContent = "Tap to place the pin. Pinch or use + to zoom; drag to move.";
  }catch(err){ $('planMsg').textContent = "Could not render plan: "+err.message; }
}
function showPin(x,y){ const p=$('planPin');
  p.style.left=(x*100)+"%"; p.style.top=(y*100)+"%"; p.hidden=false; }

$('planClear').onclick = () => { pendingLoc=null; $('planPin').hidden=true;
  $('planMsg').textContent="Pin cleared — tap Done to save without a location."; };
$('planSkip').onclick = () => { $('planDlg').close(); say("No location yet — tap 📍 to add one.",""); };
$('planDone').onclick = async () => {
  $('planDlg').close();
  if (pendingLoc) rememberSheet(`${pendingLoc.plan_id}|${pendingLoc.page || 1}`);
  await patch({location:pendingLoc});
};

/* back to the project page; the report is generated from there */
$('btnFinish').onclick = async () => {
  Dictate.stop();
  try{ await api('/api/projects/close', {method:"POST"}); }catch(err){ /* leaving anyway */ }
  location.href = job ? `/projects/${job.job_id}` : "/";
};

load().then(() => Tips.run("items", [
  {at: '#thumb', text: "Tap to take a photo, or choose one from your library. Tap the photo later to add more, retake or delete."},
  {at: '#toolLoc', text: "Place this item on the plan. After the first photo, this opens by itself."},
  {at: '#desc', text: "Type, or tap the mic and speak. Add an Action below if the contractor needs to do something; that makes it an action item."},
  {at: '#next', text: "Go to the next item. On the last item, it starts a new one."},
])).catch(e => say(e.message,"bad"));
</script>
</body>
