<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GFDS StrucObs</title>
<style>
:root{
  --bg:#fff;--fg:#14181d;--mut:#667085;--line:#e4e7ec;--card:#f9fafb;--card2:#f2f4f7;
  --accent:#1554b8;--accent-fg:#fff;--ok:#067647;--bad:#b42318;--warn:#b54708;
  --info:#5b6b7c;--minor:#2e7d32;--major:#b54708;--critical:#b42318;--safety:#6941c6;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e1216;--fg:#e8eaed;--mut:#98a2b3;--line:#262c33;--card:#161a1f;--card2:#1d2227;
  --accent:#4d8df0;--accent-fg:#06101f;--ok:#5fd09a;--bad:#ff8a80;--warn:#f5b26b;
  --info:#8fa0b0;--minor:#5fd09a;--major:#f5b26b;--critical:#ff8a80;--safety:#c3a6ff;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:0 14px calc(90px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 0 11px;
  border-bottom:1px solid var(--line)}
.back{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;
  border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--fg);text-decoration:none;font-size:23px;line-height:1}
.projName{font-weight:700;font-size:16.5px;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mut);font-size:12px}
button{font:inherit;border:0;border-radius:9px;background:var(--accent);
  color:var(--accent-fg);padding:11px 14px;font-weight:600;cursor:pointer}
button.ghost{background:var(--card2);color:var(--fg);border:1px solid var(--line)}
button.ghost:disabled{opacity:.35}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.sm{padding:9px 10px;font-size:12.5px}
button.wide{width:100%}
.nav{display:flex;align-items:center;gap:10px;margin-top:13px}
.nav button{min-width:54px;font-size:19px;line-height:1;padding:12px 0;flex:0 0 auto}
.nav .label{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.nav .label small{display:block;font-weight:500;font-size:10.5px;color:var(--mut);
  letter-spacing:.09em;text-transform:uppercase}
.nav.item button{background:var(--accent);color:var(--accent-fg)}
.nav.item button.itemDel{background:transparent;color:var(--bad);
  border:1px solid var(--line);min-width:46px;font-size:16px}
.nav.photo{margin-top:8px}
.nav.photo button{background:var(--card2);color:var(--fg);border:1px solid var(--line);
  font-size:15px;min-width:44px;padding:8px 0}
.nav.photo .label{font-size:15px}
.idTag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.photoBox{position:relative;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;margin-top:10px;overflow:hidden;min-height:190px;
  display:flex;align-items:center;justify-content:center}
.photoBox img{width:100%;display:block}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.empty p{margin:0 0 11px;font-size:13.5px}
input[type=file]{display:none}
textarea,input[type=text],select{width:100%;padding:11px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);font:inherit}
textarea{min-height:82px;resize:vertical}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px;margin-top:11px}
.card h2{margin:0 0 9px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--bg);color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{color:#fff;border-color:transparent}
.chip[data-v=Info][aria-pressed=true]{background:var(--info)}
.chip[data-v=Minor][aria-pressed=true]{background:var(--minor)}
.chip[data-v=Major][aria-pressed=true]{background:var(--major)}
.chip[data-v=Critical][aria-pressed=true]{background:var(--critical)}
.chip[data-v=Safety][aria-pressed=true]{background:var(--safety)}
.inc{display:flex;align-items:center;gap:11px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:11px}
.inc .t{flex:1;font-size:13.5px;font-weight:600}
.inc .t small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.sw{position:relative;width:48px;height:29px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s}
.sw span::after{content:"";position:absolute;width:23px;height:23px;border-radius:50%;
  background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span::after{transform:translateX(19px)}
.msg{font-size:12px;color:var(--mut);margin-top:7px;min-height:15px}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.row{display:flex;gap:8px}.row>*{flex:1}
.loc{display:flex;align-items:center;gap:11px}
.loc canvas{width:72px;height:72px;border-radius:9px;border:1px solid var(--line);
  flex:0 0 auto;background:var(--card2)}
.loc .d{flex:1;font-size:12.5px;color:var(--mut)}
.tx{display:flex;gap:9px;align-items:flex-start;margin-top:10px;
  font-size:12px;color:var(--mut);cursor:pointer}
.tx input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.clip{display:flex;align-items:center;gap:8px;background:var(--card2);
  border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:8px}
.clip audio{flex:1;min-width:0;height:32px}
.clip .id{font-size:10.5px;color:var(--mut);font-weight:700;flex:0 0 auto}
.clip button{background:transparent;color:var(--bad);border:0;padding:3px 6px;font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:40}
.bar .wrap{display:flex;gap:8px}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--fg);
  max-width:94vw;width:600px}
dialog::backdrop{background:rgba(0,0,0,.65)}
.dlgHead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-bottom:1px solid var(--line)}
.dlgHead b{font-size:14.5px}
.dlgBody{padding:14px;max-height:72vh;overflow:auto}
#planHolder{position:relative;touch-action:manipulation}
#planCanvas{width:100%;display:block;border:1px solid var(--line);border-radius:9px}
.pin{position:absolute;width:26px;height:26px;margin:-26px 0 0 -13px;pointer-events:none}
.opt{display:block;width:100%;text-align:left;background:var(--card2);color:var(--fg);
  border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}
.opt b{display:block;font-size:14.5px;margin-bottom:2px}
.opt span{font-size:12.5px;color:var(--mut);font-weight:400;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">

<header>
  <a class="back" href="/" id="backLink" title="Project">&lsaquo;</a>
  <div style="flex:1;min-width:0">
    <div class="projName" id="projName">&nbsp;</div>
    <div class="sub" id="visitSub">Loading…</div>
  </div>
  <div style="display:flex;gap:6px;flex:0 0 auto">
    <button class="ghost sm" id="btnPlans">Plans</button>
  </div>
</header>

<div class="nav item">
  <button id="itemPrev" aria-label="Previous item">&#9664;</button>
  <div class="label" id="itemLabel"><small>Item</small>—</div>
  <button id="itemNext" aria-label="Next item">&#9654;</button>
  <button class="danger itemDel" id="btnDelItem" title="Delete this item">&#128465;</button>
</div>

<div class="photoBox" id="photoBox"></div>

<div class="nav photo">
  <button id="photoPrev" aria-label="Previous photo">&#8592;</button>
  <div class="label idTag" id="photoLabel">—</div>
  <button id="photoNext" aria-label="Next photo">&#8594;</button>
</div>
<div class="row" style="margin-top:8px">
  <button id="btnTake">&#128247; Take photo</button>
  <button class="danger" id="btnDelPhoto" style="flex:0 0 auto">&#128465;</button>
</div>
<input type="file" accept="image/*" capture="environment" id="camInput">
<input type="file" accept="application/pdf,image/*" id="planInput">

<div class="inc">
  <div class="t">Include in report
    <small id="incHint">This incident will appear in the Word report</small></div>
  <label class="sw"><input type="checkbox" id="include" checked><span></span></label>
</div>

<div class="card">
  <h2>Location on plan <span style="text-transform:none;letter-spacing:0">(optional)</span></h2>
  <div id="locBody"></div>
</div>

<div class="card">
  <h2>Description</h2>
  <textarea id="desc" placeholder="Type the description — or dictate it."></textarea>
  <button class="wide dict" id="btnDictate" style="margin-top:8px">&#127908; Dictate</button>
  <div class="msg" id="recMsg"></div>
</div>

<div class="card">
  <h2>Action <span style="text-transform:none;letter-spacing:0">(optional — makes this an action item)</span></h2>
  <textarea id="action" placeholder="Type the action — or dictate it. e.g. The Contractor will install new headers per 4/S8.1."></textarea>
  <button class="wide dict" id="btnDictateAct" style="margin-top:8px">&#127908; Dictate</button>
  <div class="msg" id="actMsg"></div>
  <div id="axBox"></div>
</div>

<div class="card">
  <h2>Importance</h2>
  <div class="chips" id="impChips"></div>
</div>

<div class="card">
  <h2>Tags</h2>
  <input type="text" id="tags" placeholder="comma, separated, tags">
</div>

<div class="msg" id="status"></div>
</div>

<div class="bar"><div class="wrap">
  <button id="btnNewItem" style="flex:2">+ New item</button>
  <button class="ghost" id="btnFinish" style="flex:1.4">Finish site visit</button>
</div></div>

<dialog id="addDlg">
  <div class="dlgHead"><b>New photo in this item</b>
    <button class="ghost sm" id="addCancel">Cancel</button></div>
  <div class="dlgBody">
    <button class="opt" id="optKeep"><b>Keep previous details</b>
      <span id="keepPreview"></span></button>
    <button class="opt" id="optClear"><b>Start blank</b>
      <span>Empty description, Info, no location — a different incident.</span></button>
  </div>
</dialog>

<dialog id="planDlg">
  <div class="dlgHead"><b>Tap the location</b>
    <div style="display:flex;gap:7px">
      <button class="ghost sm" id="planClear">Clear</button>
      <button class="sm" id="planDone">Done</button></div></div>
  <div class="dlgBody">
    <select id="planSelect" style="margin-bottom:10px"></select>
    <div id="planHolder">
      <canvas id="planCanvas"></canvas>
      <div class="pin" id="planPin" hidden>
        <svg viewBox="0 0 24 24" width="26" height="26">
          <path d="M12 0C7 0 3 4 3 9c0 6.5 9 15 9 15s9-8.5 9-15c0-5-4-9-9-9z" fill="#e5484d"/>
          <circle cx="12" cy="9" r="3.4" fill="#fff"/></svg>
      </div>
    </div>
    <div class="msg" id="planMsg"></div>
  </div>
</dialog>

{% include "_actions.html" %}

<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";

const $ = id => document.getElementById(id);
const IMPORTANCE = ["Info","Minor","Major","Critical","Safety"];
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let items = [], plans = [], ii = 0, pi = 0;
let visit = null, job = null;
/* the printed number: ITEM <visit>.<entry number> */
const label = e => `${visit ? visit.visit_no : "?"}.${e.number}`;
let pendingLoc = null;

const item  = () => items[ii] || null;
/* the incident: an item's photo entry */
const entry = () => { const it = item(); return it && it.photos[pi] || null; };

async function api(path, opts={}){
  const res = await fetch(path, opts);
  if (res.status === 401){ location.href = "/login"; throw new Error("unauthorized"); }
  if (res.status === 409){ location.href = "/"; throw new Error("no project open"); }
  const ct = res.headers.get("content-type") || "";
  const body = ct.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(body?.error || res.statusText);
  return body;
}
const say = (t,c="") => { $('status').className = "msg "+c; $('status').textContent = t; };

/* ---------------- render ---------------- */
function render(){
  const it = item(), e = entry();
  const incidents = items.reduce((n,x)=>n+x.photos.length,0);
  const included  = items.reduce((n,x)=>n+x.photos.filter(p=>p.include).length,0);
  $('visitSub').textContent = (visit ? `Site Visit ${visit.visit_no} · ` : "") +
    `${items.length} item${items.length===1?"":"s"} · ${incidents} incident${incidents===1?"":"s"} · ${included} in report`;

  $('itemLabel').innerHTML = it
    ? `<small>Item</small>${it.photos.length ? it.photos.map(label).join(", ") : it.item_id}
       <span style="color:var(--mut);font-weight:500;font-size:13px">${ii+1}/${items.length}</span>`
    : `<small>Item</small>—`;
  $('itemPrev').disabled = ii <= 0;
  $('itemNext').disabled = ii >= items.length - 1;

  if (!it){
    $('photoBox').innerHTML =
      `<div class="empty"><p>No items yet.</p><button id="first">+ New item</button></div>`;
    $('first').onclick = newItem;
    $('photoLabel').textContent = "—";
    $('locBody').innerHTML = "";
    ['photoPrev','photoNext','btnTake','btnDelPhoto','btnDelItem','include',
     'desc','tags','btnDictate','btnDictateAct','action'].forEach(id => $(id).disabled = true);
    $('axBox').innerHTML = "";
    return;
  }
  ['photoPrev','photoNext','btnTake','btnDelPhoto','btnDelItem','include',
   'desc','tags','btnDictate','btnDictateAct','action'].forEach(id => $(id).disabled = false);

  if (!e){
    $('photoBox').innerHTML = `<div class="empty"><p>No photo entries.</p>
      <button id="addFirst">&#128247; Take photo</button></div>`;
    $('addFirst').onclick = () => addEntry("clear");
    $('photoLabel').textContent = "—";
    return;
  }

  /* image */
  if (e.filename){
    $('photoBox').innerHTML = `<img src="${e.url}" alt="">`;
  } else {
    $('photoBox').innerHTML = `<div class="empty">
      <p>No image on ITEM ${label(e)} yet</p>
      <button id="shootCam">&#128247; Take photo</button></div>`;
    $('shootCam').onclick = takePhoto;
  }

  const n = it.photos.length;
  $('photoLabel').innerHTML =
    `ITEM ${label(e)} <span style="color:var(--mut);font-weight:500;font-size:12px">${pi+1}/${n}</span>`;
  $('photoPrev').disabled = pi <= 0;
  $('photoNext').disabled = pi >= n - 1;

  /* per-incident fields */
  $('include').checked = e.include;
  $('incHint').textContent = e.include
    ? "This incident will appear in the Word report"
    : "Excluded — will NOT appear in the report";
  /* never overwrite a box mid-dictation or mid-typing */
  if (dictating !== "desc") $('desc').value = e.description || "";
  if (dictating !== "action" && document.activeElement !== $('action'))
    $('action').value = e.action || "";
  renderActions();
  $('tags').value = (e.tags || []).join(", ");

  $('impChips').innerHTML = IMPORTANCE.map(v =>
    `<button class="chip" data-v="${v}" aria-pressed="${e.importance===v}">${v}</button>`).join("");
  [...$('impChips').children].forEach(b => b.onclick = () => patch({importance:b.dataset.v}));

  if (e.location){
    const p = plans.find(x => x.plan_id === e.location.plan_id);
    $('locBody').innerHTML =
      `<div class="loc"><canvas id="locThumb" width="72" height="72"></canvas>
       <div class="d"><b style="color:var(--fg)">${p?esc(p.name):"plan"}</b><br>
       page ${e.location.page} · x ${e.location.x.toFixed(3)} · y ${e.location.y.toFixed(3)}</div>
       <button class="ghost sm" id="locEdit">Change</button></div>`;
    $('locEdit').onclick = openPlan;
    const c = $('locThumb'), ctx = c.getContext('2d');
    ctx.fillStyle="#8884"; ctx.fillRect(0,0,72,72);
    ctx.fillStyle="#e5484d"; ctx.beginPath();
    ctx.arc(e.location.x*72, e.location.y*72, 6, 0, 7); ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
  } else {
    $('locBody').innerHTML = `<button class="ghost wide" id="locPick">Pick location on plan</button>`;
    $('locPick').onclick = openPlan;
  }
}

/* updates and close-out, once the entry has a saved Action */
function renderActions(){
  const e = entry();
  if (!e || !(e.action || "").trim() || !visit){ $('axBox').innerHTML = ""; return; }
  const latest = job && job.last_visit ? job.last_visit.visit_no : visit.visit_no;
  ActionUI.render($('axBox'), {
    pid: visit.project_id, visit_no: visit.visit_no, photo_id: e.photo_id, label: label(e),
    updates: e.updates, closed_visit_no: e.closed_visit_no,
    default_visit_no: Math.max(latest, visit.visit_no + 1),
  }, fresh => { Object.assign(e, fresh); renderActions(); });
}

/* ---------------- data ---------------- */
async function load(){
  const cur = await api('/api/visits/current');
  visit = cur.visit; job = cur.job;
  const name = job ? job.name : "GFDS StrucObs";
  $('projName').textContent = name;
  document.title = `${name} SV${visit.visit_no} — GFDS StrucObs`;
  if (job) $('backLink').href = `/projects/${job.job_id}`;
  const d = await api('/api/visit');
  items = d.items; plans = d.plans;
  if (ii >= items.length) ii = Math.max(0, items.length-1);
  const it = item(); if (it && pi >= it.photos.length) pi = Math.max(0, it.photos.length-1);
  render();
}

/* patch the current incident */
async function patch(fields){
  const it = item(), e = entry(); if (!it || !e) return;
  Object.assign(e, await api(`/api/item/${it.item_id}/photo/${e.photo_id}`, {
    method:"PATCH", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(fields)}));
  render();
}

async function newItem(){
  const it = await api('/api/item', {method:"POST"});
  items.push(it); ii = items.length-1; pi = 0;
  render(); say(`Created ITEM ${label(it.photos[0])}`,"ok");
}

async function addEntry(mode){
  const it = item(); if (!it) return;
  const fd = new FormData(); fd.append("inherit", mode);
  const e = await api(`/api/item/${it.item_id}/photo`, {method:"POST", body:fd});
  it.photos.push(e); pi = it.photos.length-1;
  render();
  say(mode==="keep" ? `${e.photo_id} — details carried over.` : `${e.photo_id} — blank entry.`, "ok");
  $('camInput').click();
}

$('itemPrev').onclick = () => { if (ii>0){ ii--; pi=0; render(); } };
$('itemNext').onclick = () => { if (ii<items.length-1){ ii++; pi=0; render(); } };
$('photoPrev').onclick = () => { if (pi>0){ pi--; render(); } };
$('photoNext').onclick = () => { const it=item(); if (it&&pi<it.photos.length-1){ pi++; render(); } };
$('btnNewItem').onclick = newItem;

$('btnDelItem').onclick = async () => {
  const it = item(); if (!it) return;
  const n = it.photos.length;
  const withPhotos = it.photos.filter(p => p.filename).length;
  const clips = it.photos.reduce((a,p) => a + (p.audio_clips||[]).length, 0);
  const bits = [`${n} incident${n===1?"":"s"}`];
  if (withPhotos) bits.push(`${withPhotos} photo${withPhotos===1?"":"s"}`);
  if (clips) bits.push(`${clips} recording${clips===1?"":"s"}`);
  if (!confirm(`Delete item ${it.item_id}?\n\n${bits.join(" · ")} will be permanently removed. This cannot be undone.`)) return;
  await api(`/api/item/${it.item_id}`, {method:"DELETE"});
  items.splice(ii,1);
  if (ii >= items.length) ii = Math.max(0, items.length-1);
  pi = 0;
  render(); say(`Item ${it.item_id} deleted.`,"ok");
};

/* `capture` sends a phone straight into its camera app.
   Empty entry -> fill it. Entry already has an image -> ask Keep/Clear first,
   then take the new entry's photo. */
function takePhoto(){
  const e = entry();
  if (!e) return addEntry("clear");
  if (!e.filename) return $('camInput').click();
  showAddDialog();
}
$('btnTake').onclick = takePhoto;

function showAddDialog(){
  const e = entry();
  const bits = [];
  if (e.description) bits.push(`“${e.description.slice(0,42)}${e.description.length>42?"…":""}”`);
  bits.push(e.importance);
  if (e.location) bits.push("same plan location");
  if ((e.tags||[]).length) bits.push(e.tags.join(", "));
  $('keepPreview').textContent = "Carries over: " + bits.join(" · ") + ".";
  $('addDlg').showModal();
}
$('addCancel').onclick = () => $('addDlg').close();
$('optKeep').onclick  = () => { $('addDlg').close(); addEntry("keep"); };
$('optClear').onclick = () => { $('addDlg').close(); addEntry("clear"); };

async function onPicked(ev){
  const f = ev.target.files[0]; if (!f || !item()) return;
  ev.target.value = "";
  const fd = new FormData(); fd.append("photo", f);
  /* name the entry: without it the server would pick the oldest imageless one */
  const target = entry(); if (target && !target.filename) fd.append("photo_id", target.photo_id);
  say("Uploading photo…","warn");
  const e = await api(`/api/item/${item().item_id}/photo`, {method:"POST", body:fd});
  const it = item(), at = it.photos.findIndex(p => p.photo_id === e.photo_id);
  if (at >= 0) it.photos[at] = e; else it.photos.push(e);
  pi = it.photos.findIndex(p => p.photo_id === e.photo_id);
  render(); say(`Photo on ${e.photo_id}`,"ok");
}
$('camInput').onchange = onPicked;

$('btnDelPhoto').onclick = async () => {
  const it = item(), e = entry(); if (!e) return;
  if (!confirm(`Delete incident ${e.photo_id}?\nIts photo, audio and details go with it.`)) return;
  await api(`/api/item/${it.item_id}/photo/${e.photo_id}`, {method:"DELETE"});
  it.photos.splice(pi,1); pi = Math.max(0, pi-1);
  render(); say("Deleted.","ok");
};

$('include').onchange = ev => patch({include: ev.target.checked});
let dT; $('desc').oninput = () => { clearTimeout(dT);
  dT = setTimeout(()=>patch({description:$('desc').value}), 700); };
let aT; $('action').oninput = () => { clearTimeout(aT);
  aT = setTimeout(()=>patch({action:$('action').value}), 700); };
let tT; $('tags').oninput = () => { clearTimeout(tT); tT = setTimeout(()=>
  patch({tags: $('tags').value.split(",").map(s=>s.trim()).filter(Boolean)}), 700); };

/* ---------------- dictation ---------------- */

/* Fold a SpeechRecognition results list into {fin, interim}, tolerating both
   fragment-per-entry and cumulative-per-entry browsers.

   Comparison is done on a normalised copy (lowercased, punctuation stripped)
   because Android capitalises and punctuates finalised entries, so an exact
   startsWith would miss the overlap and let the duplicates back in. */
function speechKey(t){
  return t.toLowerCase().replace(/[.,!?;:\u2019']/g, "").replace(/\s+/g, " ").trim();
}

function assembleSpeech(results){
  const finals = [];
  let interim = "";
  for (let i = 0; i < results.length; i++){
    const t = (results[i][0] && results[i][0].transcript || "").trim();
    if (!t) continue;
    if (results[i].isFinal) finals.push(t);
    else interim = t;            // the newest interim IS the whole current guess
  }

  let fin = "";
  for (const t of finals){
    if (!fin){ fin = t; continue; }
    const a = speechKey(fin), b = speechKey(t);
    /* cumulative only when the entry is STRICTLY longer and extends what we
       have; equal-length means the speaker genuinely repeated themselves */
    if (b.length > a.length && b.startsWith(a)) fin = t;
    else fin += " " + t;
  }

  /* an interim that merely restates the final adds nothing - but never let an
     interim become the final when there is no final yet */
  if (fin && interim){
    const a = speechKey(fin), b = speechKey(interim);
    if (b.length > a.length && b.startsWith(a)){ fin = interim; interim = ""; }
    else if (a.endsWith(b)) interim = "";
  }
  return { fin, interim };
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
/* one dictation at a time: which box it fills, and its button and message */
let sr=null, dictating=null, baseText="", finalText="", wantMore=false;
const DICTATE = {
  desc:   {box:'desc',   btn:'btnDictate',    msg:'recMsg', field:'description'},
  action: {box:'action', btn:'btnDictateAct', msg:'actMsg', field:'action'},
};
const MIC = "&#127908; Dictate";
if (!SR) [$('btnDictate'), $('btnDictateAct')].forEach(b => b.title = "This browser has no speech recognition");

function dictate(which){
  const d = DICTATE[which], note = (t,c) => { $(d.msg).className = "msg "+c; $(d.msg).textContent = t; };
  if (!entry()) return say("Add an item first","bad");
  if (!SR) return note("No browser dictation — use the mic key on your keyboard.","bad");
  if (dictating){ wantMore = false; sr.stop(); return; }   // either button stops it
  sr = new SR(); sr.lang = "en-US"; sr.interimResults = true;
  /* Chrome on Android duplicates finalised results when continuous is on, so
     run single-utterance there and restart on end while the user is still
     dictating. Desktop keeps continuous for a smoother stream. */
  sr.continuous = !/Android/i.test(navigator.userAgent);
  wantMore = true;
  /* keep what is already typed exactly, line breaks and all; only add a
     separator when it does not already end in whitespace */
  baseText = $(d.box).value;
  if (baseText && !/\s$/.test(baseText)) baseText += " ";
  finalText = "";
  sr.onstart = () => { dictating = which; $(d.btn).textContent = "■ Stop dictating";
    note("Listening — speak now.","warn"); };
  /* Rebuild from the whole results list every time: several mobile browsers
     report resultIndex as 0 on every event, and some repeat the whole
     transcript in every entry. assembleSpeech() copes with both. */
  sr.onresult = ev => {
    const { fin, interim } = assembleSpeech(ev.results);
    finalText = fin;
    const spoken = (fin + (fin && interim ? " " : "") + interim);
    $(d.box).value = baseText + spoken.replace(/\s+/g, " ").trimStart();
  };
  sr.onerror = ev => {
    if (ev.error === "no-speech" && wantMore) return;   // restarting; stay quiet
    wantMore = false;
    note(ev.error==="not-allowed" ? "Microphone permission denied."
      : ev.error==="no-speech" ? "Didn't catch anything — try again."
      : ev.error==="network" ? "Dictation needs a network connection."
      : "Dictation error: "+ev.error, "bad"); };
  sr.onend = () => {
    if (wantMore) {                      // single-utterance mode: keep listening
      const committed = (baseText + finalText).replace(/\s+/g, " ").trimStart();
      baseText = committed ? committed + " " : "";
      finalText = "";
      try { sr.start(); return; } catch (e) { /* fall through and stop */ }
    }
    dictating = null; $(d.btn).innerHTML = MIC;
    /* keep only finalised speech; drop any trailing interim guess */
    $(d.box).value = (baseText + finalText.replace(/\s+/g, " ").trimStart()).trimEnd();
    patch({[d.field]: $(d.box).value});
    if (!$(d.msg).classList.contains("bad"))
      note(finalText.trim() ? "Dictation saved." : "Nothing captured.", "ok");
  };
  try { sr.start(); }
  catch(err){ note("Could not start: "+err.message, "bad"); }
}
$('btnDictate').onclick = () => dictate("desc");
$('btnDictateAct').onclick = () => dictate("action");

/* ---------------- plans ---------------- */
$('btnPlans').onclick = () => $('planInput').click();
$('planInput').onchange = async ev => {
  const f = ev.target.files[0]; if (!f) return; ev.target.value="";
  const fd = new FormData(); fd.append("plan", f);
  say("Uploading plan…","warn");
  const p = await api('/api/plan',{method:"POST", body:fd});
  plans.push(p); say(`Plan “${p.name}” uploaded`,"ok");
};

async function openPlan(){
  if (!plans.length) return say("Upload a plan first — tap “Plans”.","bad");
  $('planSelect').innerHTML = plans.map(p =>
    `<option value="${p.plan_id}">${esc(p.name)} (${p.pages} page${p.pages===1?"":"s"})</option>`).join("");
  const e = entry();
  pendingLoc = e.location ? {...e.location} : null;
  if (pendingLoc) $('planSelect').value = pendingLoc.plan_id;
  $('planDlg').showModal();
  await drawPlan();
}
$('planSelect').onchange = () => { pendingLoc=null; $('planPin').hidden=true; drawPlan(); };

async function drawPlan(){
  const p = plans.find(x => x.plan_id === $('planSelect').value);
  const cv = $('planCanvas'), ctx = cv.getContext('2d');
  $('planMsg').textContent = "Loading plan…";
  try{
    if ((p.name||"").toLowerCase().endsWith(".pdf")){
      const buf = await (await fetch(p.url)).arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const page = await pdf.getPage(pendingLoc?.page || 1);
      const vp = page.getViewport({scale:2});
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      $('planMsg').textContent = `Page 1 of ${pdf.numPages} — tap to place the marker.`;
    } else {
      const img = new Image();
      await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=p.url;});
      cv.width=img.width; cv.height=img.height; ctx.drawImage(img,0,0);
      $('planMsg').textContent = "Tap to place the marker.";
    }
    if (pendingLoc) showPin(pendingLoc.x, pendingLoc.y);
  }catch(err){ $('planMsg').textContent = "Could not render plan: "+err.message; }
}
function showPin(x,y){ const p=$('planPin');
  p.style.left=(x*100)+"%"; p.style.top=(y*100)+"%"; p.hidden=false; }

$('planCanvas').onclick = ev => {
  const r = $('planCanvas').getBoundingClientRect();
  /* normalised 0-1: survives any screen size, zoom or re-render */
  const x = (ev.clientX-r.left)/r.width, y = (ev.clientY-r.top)/r.height;
  pendingLoc = {plan_id:$('planSelect').value, page: pendingLoc?.page || 1, x, y};
  showPin(x,y);
  $('planMsg').textContent = `x ${x.toFixed(3)} · y ${y.toFixed(3)}`;
};
$('planClear').onclick = () => { pendingLoc=null; $('planPin').hidden=true;
  $('planMsg').textContent="Marker cleared."; };
$('planDone').onclick = async () => { $('planDlg').close(); await patch({location:pendingLoc}); };

/* back to the project page; the report is generated from there */
$('btnFinish').onclick = async () => {
  if (dictating){ wantMore = false; sr.stop(); }
  try{ await api('/api/projects/close', {method:"POST"}); }catch(err){ /* leaving anyway */ }
  location.href = job ? `/projects/${job.job_id}` : "/";
};

load().catch(e => say(e.message,"bad"));
